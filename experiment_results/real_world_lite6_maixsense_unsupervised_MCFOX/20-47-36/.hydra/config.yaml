experiment:
  config:
    do_eval: true
    do_train: true
    monty_config:
      monty_class: ${monty.class:tbp.monty.frameworks.models.graph_matching.MontyForGraphMatching}
      monty_args:
        num_exploratory_steps: 35
        min_eval_steps: 1
        min_train_steps: 1
        max_total_steps: 2500
      motor_system_config:
        policy_selector:
          policy:
            action_sampler:
              _target_: tbp.monty.frameworks.actions.action_samplers.ConstantSampler
              actions:
              - ${monty.class:tbp.monty.frameworks.actions.actions.MoveForward}
              - ${monty.class:tbp.monty.frameworks.actions.actions.MoveTangentially}
              - ${monty.class:tbp.monty.frameworks.actions.actions.OrientHorizontal}
              - ${monty.class:tbp.monty.frameworks.actions.actions.OrientVertical}
            _target_: multimodal_monty_meets_world.real_world_surface_policy.RealWorldSurfacePolicy
            use_goal_driven_actions: false
            agent_id: agent_id_0
            desired_object_distance: 0.15
            alpha: 0.1
          _target_: tbp.monty.frameworks.models.motor_policy_selectors.SinglePolicySelector
        _target_: tbp.monty.frameworks.models.motor_system.MotorSystem
      learning_module_configs:
        learning_module_0:
          learning_module_args:
            tolerances:
              patch:
                hsv: ${np.array:[0.1, 0.2, 0.2]}
                principal_curvatures_log: ${np.array:[3.0, 3.0]}
            feature_weights:
              patch:
                hsv: ${np.array:[1, 0.5, 0.5]}
                pose_vectors: ${np.ones:3}
                principal_curvatures_log: ${np.array:[0.0, 0.0]}
            max_match_distance: 0.015
            x_percent_threshold: 50
            graph_delta_thresholds:
              patch:
                distance: 0.008
                pose_vectors: ${np.list_eval:[np.pi / 6, np.pi * 2, np.pi * 2]}
                principal_curvatures_log:
                - 3.0
                - 3.0
                hsv:
                - 0.1
                - 1
                - 1
            object_evidence_threshold: 100
            required_symmetry_evidence: 20
            hypotheses_updater_args:
              max_nneighbors: 10
          learning_module_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM}
      sensor_module_configs:
        sensor_module_0:
          sensor_module_class: ${monty.class:tbp.monty.frameworks.models.sensor_modules.CameraSM}
          sensor_module_args:
            is_surface_sm: true
            sensor_module_id: patch
            surface_normal_method: HUBER
            surface_normal_neighbor_patch_frac: 1.5
            features:
            - pose_vectors
            - pose_fully_defined
            - on_object
            - object_coverage
            - min_depth
            - mean_depth
            - hsv
            - principal_curvatures
            - principal_curvatures_log
            - gaussian_curvature
            - mean_curvature
            - gaussian_curvature_sc
            - mean_curvature_sc
            save_raw_obs: true
      sm_to_agent_dict:
        patch: agent_id_0
      sm_to_lm_matrix:
      - - 0
      lm_to_lm_matrix: null
      lm_to_lm_vote_matrix: null
    environment:
      env_init_func: ${monty.class:tbp.monty.frameworks.environments.real_world_environment.RealWorldLite6A010Environment}
      env_init_args:
        robot_interface:
          _target_: multimodal_monty_meets_world.factory.create_robot_interface
          ip_address: 192.168.1.159
          start_listener: true
        sensor_client:
          _target_: multimodal_monty_meets_world.factory.create_usb_frame_client
          port: /dev/sipeed
          baudrate: 921600
          timeout: 0.05
          validate_checksum: true
          checksum_policy: compatible
          auto_configure_stream: true
          stream_display_mode: 3
          stream_startup_delay_s: 0.15
        observation_adapter:
          _target_: multimodal_monty_meets_world.factory.create_observation_adapter
          fx: 71.41
          fy: 86.6
          cx: 50.0
          cy: 50.0
          crop_center_to_square: true
          patch_height: 14
          patch_width: 14
          patch_offset_bottom_px: 18
          patch_offset_left_px: 43
          depth_median_filter_size: 3
          min_valid_depth_m: 0.05
          max_valid_depth_m: 0.6
          world_y_min_m: 0.04
          world_x_max_m: 0.3
          world_x_min_m: -0.3
          world_z_max_m: -0.1
          world_z_min_m: -0.5
          semantic_debug_logging: false
        goal_adapter: null
        goal_adapter_config:
          world_to_robot_translation_m:
          - 0.0
          - 0.0
          - 0.0
          world_to_robot_rotation_dict:
            w: 0.5
            x: 0.5
            'y': -0.5
            z: -0.5
          link6_to_sensor_translation_m:
          - 0.06
          - 0.0
          - 0.0135
          link6_to_sensor_rotation_dict:
            w: 0.0
            x: 0.0
            'y': 1.0
            z: 0.0
          workspace_min_xyz_m:
          - 0.135
          - -0.23
          - 0.075
          workspace_max_xyz_m:
          - 0.4
          - 0.32
          - 0.4
          max_translation_step_m: 0.1
          max_rotation_step_deg: 35.0
          orientation_min_euler_deg:
          - -180.0
          - -170.0
          - -180.0
          orientation_max_euler_deg:
          - 180.0
          - 170.0
          - 180.0
          convergence_timeout_s: 4.0
          convergence_position_tolerance_mm: 3.0
          min_command_interval_s: 0.0
          wait_for_min_command_interval: true
          wait_until_ready: true
          wait_until_ready_timeout_s: 2.0
          wait_until_ready_poll_s: 0.02
          payload_mass_kg: 0.056
          euler_sequence: xyz
          euler_degrees: true
          debug_logging: true
        agent_id: agent_id_0
        sensor_id: patch
        home_pose_mm_deg:
        - 220
        - 9
        - 300
        - 180
        - 0.0
        - 0.0
        settle_time_s: 0.25
        settle_use_goal_convergence_gate: true
        settle_convergence_position_tolerance_mm: 3.0
        settle_convergence_required_consecutive_samples: 2
        home_reset_timeout_s: 8.0
        home_reset_poll_s: 0.02
        home_reset_position_tolerance_mm: 20.0
        home_reset_orientation_tolerance_deg: 10.0
        require_object_swap_confirmation: true
        object_swap_prompt: 'Swap/position the object, then press Enter to continue: '
        sensor_translation_m:
        - 0.0
        - 0.0
        - 0.0
        sensor_rotation_wxyz:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        depth_unit: 0
        sensor_frame_timeout_s: 1.5
        sensor_frame_max_retries: 3
        sensor_frame_retry_delay_s: 0.05
        depth_burst_n: 5
        sensed_orientation_sequence: xyz
        sensed_orientation_degrees: false
        sensed_orientation_intrinsic: false
        sensed_orientation_index_order:
        - 0
        - 1
        - 2
        sensed_orientation_signs:
        - 1.0
        - 1.0
        - 1.0
        sensed_orientation_offset_wxyz:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        sensed_motion_offset_wxyz:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        min_sensor_height_m: 0.05
        motion_debug_logging: true
      transform: null
    train_env_interface_class: ${monty.class:tbp.monty.frameworks.environments.real_world_interface.RealWorldEnvironmentInterface}
    train_env_interface_args:
      use_goal_pose_dispatch: true
    eval_env_interface_class: ${monty.class:tbp.monty.frameworks.environments.real_world_interface.RealWorldEnvironmentInterface}
    eval_env_interface_args:
      use_goal_pose_dispatch: true
    logging:
      monty_log_level: BASIC
      monty_handlers:
      - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler}
      wandb_handlers: []
      python_log_level: DEBUG
      python_log_to_file: true
      python_log_to_stderr: true
      output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/monty_runs/}
      run_name: real_world_lite6_maixsense_unsupervised
      resume_wandb_run: false
      wandb_id:
        _target_: wandb.util.generate_id
      wandb_group: debugging
    show_sensor_output: false
    max_train_steps: 200
    max_eval_steps: 200
    max_total_steps: 400
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ''
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
episodes: all
num_parallel: 16
print_cfg: false
quiet_habitat_logs: true
constants:
  default_all_noise_params:
    features:
      pose_vectors: 2
      hsv: 0.1
      principal_curvatures_log: 0.1
      pose_fully_defined: 0.01
    location: 0.002
  default_sensor_features:
  - pose_vectors
  - pose_fully_defined
  - on_object
  - hsv
  - principal_curvatures_log
  min_eval_steps: 20
  pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_ycb_v12}
  compositional_pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_compositional_objects_v2}
  rotations_all_count: 14
  rotations_all:
  - - 0
