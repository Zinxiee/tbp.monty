hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - experiment=real_world/lite6_maixsense_unsupervised
  job:
    name: run
    chdir: null
    override_dirname: experiment=real_world/lite6_maixsense_unsupervised
    id: ???
    num: ???
    config_name: experiment
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/zach/tbp/tbp.monty
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: tbp.monty.conf
      schema: pkg
      provider: main
    - path: tbp.monty.conf
      schema: pkg
      provider: tbp.monty
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/zach/tbp/tbp.monty/outputs/2026-04-24/20-45-50
    choices:
      experiment: real_world/lite6_maixsense_unsupervised
      logging: basic_info_monty_runs
      env_interface: real_world_manual_train_eval
      environment: real_world_lite6_maixsense
      monty/connectivity: 1lm_patch_only
      monty/sensor_module: camera_surf_patch_only
      monty/learning_module: evidence_1lm_nn5
      monty/motor_system_config: surface
      monty/motor_system_config/policy_selector@experiment.config.monty_config.motor_system_config.policy_selector: single_policy_selector
      monty/motor_system_config/policy@experiment.config.monty_config.motor_system_config.policy: surface
      ? monty/motor_system_config/policy/action_sampler@experiment.config.monty_config.motor_system_config.policy_selector.policy.action_sampler
      : constant_surf
      monty: graph_exp1000_e3_t100_tot2500
      constants: defaults
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
