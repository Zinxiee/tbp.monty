# @package _global_

defaults:
  - /monty: graph_exp1000_emin_t3_tot2500
  # Move 8 pixels at a time
  - /monty/motor_system_config: informed_8
  - /monty/learning_module: evidence_1lm_nn10_dod003
  - /monty/sensor_module: camera_dist
  - /monty/connectivity: 1lm_1sm
  - /environment: two_d_data_zachs
  - /env_interface: eval_worldimages
  - /env_interface/transform: none
  - /logging: basic_warning_wandb_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    n_eval_epochs: 1
    model_name_or_path: ${constants.pretrained_dir}/surf_agent_1lm_numenta_lab_obj/pretrained/
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: my_monty_meets_world
      wandb_group: my_monty_meets_world
      monty_handlers:
        - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler}
      wandb_handlers:
        - ${monty.class:tbp.monty.frameworks.loggers.wandb_handlers.BasicWandbTableStatsHandler}
        - ${monty.class:tbp.monty.frameworks.loggers.wandb_handlers.BasicWandbChartStatsHandler}
    eval_env_interface_args:
      scenes: [0, 0, 0] # which scene folder do you take the version from, if all are located in the same folder you can repeat for multiple images: i.e. [0, 0, 0]
      versions: [0, 1, 2] # Change this for specific versions in the specified scene folder: i.e. [0, 1, 2]
